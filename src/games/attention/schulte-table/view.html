<div class="page">
  {{header}}

  <main>
    <section
      class="workspace"
      aria-label="舒尔特方格练习"
      data-i18n-attrs='{"aria-label":"ui.schulte-table-practice"}'
    >
      <div class="board-panel">
        <div class="board-top">
          <div class="next-wrap">
            <span id="next-label" data-i18n="ui.next">下一个</span
            ><strong id="next-number" aria-live="polite">1</strong>
          </div>
          <span class="board-count" id="board-count">0 <span>/ 25</span></span>
        </div>
        <div id="board-frame" class="board-frame">
          <div class="board-wrap">
            <div
              id="board"
              class="board"
              aria-label="数字方格"
              data-i18n-attrs='{"aria-label":"ui.number-grid"}'
            ></div>
            <div id="board-cover" class="board-cover">
              <div class="cover-content">
                <strong id="cover-title">1 <span>→</span> 25</strong>
              </div>
            </div>
          </div>
        </div>
        <div class="board-bottom">
          <span id="board-instruction" data-i18n="ui.click-from-lowest-to-highest"
            >从小到大，依次点击</span
          >
          <span><span data-i18n="rules.correct-count">正确数</span> <b id="score-count">0</b></span>
        </div>
        <div
          id="progress"
          class="progress"
          role="progressbar"
          aria-label="完成进度"
          aria-valuemin="0"
          aria-valuemax="25"
          aria-valuenow="0"
          data-i18n-attrs='{"aria-label":"ui.completion-progress"}'
        >
          <span id="progress-fill"></span>
        </div>
      </div>

      <aside class="sidebar">
        <div class="timer-block">
          <div class="timer-heading">
            <span id="timer-label" data-i18n="ui.time-remaining">用时</span
            ><span id="timer-status" class="status-dot" aria-hidden="true"></span>
          </div>
          <div
            class="timer"
            role="timer"
            aria-label="用时"
            data-i18n-attrs='{"aria-label":"ui.time-remaining"}'
          >
            <span id="timer-main">00:30</span
            ><span class="centiseconds" id="timer-fraction">.00</span>
          </div>
          <p id="result-note" class="result-note" aria-live="polite"></p>
          <button type="button" id="action" class="primary-button">
            <span id="action-label" data-i18n="ui.start">开始</span
            ><svg
              id="action-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path d="M5 12h14m-6-6 6 6-6 6"></path>
            </svg>
          </button>
        </div>

        <div class="display-scale-control">
          <label for="matrix-scale" data-i18n="ui.display-size">显示大小</label>
          <input
            type="range"
            id="matrix-scale"
            min="40"
            max="100"
            step="5"
            value="100"
            aria-controls="board"
            aria-valuetext="100%"
          />
          <output id="matrix-scale-value" for="matrix-scale">100%</output>
        </div>
        <p class="rule-note" data-i18n="rules.schulte"></p>
        <form
          id="settings"
          class="settings"
          aria-label="练习设置"
          data-i18n-attrs='{"aria-label":"ui.settings"}'
        >
          <fieldset>
            <legend data-i18n="ui.grid-size">方格大小</legend>
            <div class="size-options">
              <label><input type="radio" name="size" value="5" checked="" /><span>5×5</span></label>
              <label><input type="radio" name="size" value="6" /><span>6×6</span></label>
              <label><input type="radio" name="size" value="7" /><span>7×7</span></label>
              <label><input type="radio" name="size" value="8" /><span>8×8</span></label>
              <label><input type="radio" name="size" value="9" /><span>9×9</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="ui.click-order">点击顺序</legend>
            <div class="segmented">
              <label
                ><input type="radio" name="direction" value="asc" checked="" /><span
                  data-i18n="ui.ascending"
                  >从小到大</span
                ></label
              >
              <label
                ><input type="radio" name="direction" value="desc" /><span data-i18n="ui.descending"
                  >从大到小</span
                ></label
              >
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="ui.after-a-correct-click">点对之后</legend>
            <div class="segmented">
              <label
                ><input type="radio" name="disappear" value="false" checked="" /><span
                  data-i18n="ui.keep-numbers"
                  >保留数字</span
                ></label
              >
              <label
                ><input type="radio" name="disappear" value="true" /><span
                  data-i18n="ui.hide-numbers"
                  >消去数字</span
                ></label
              >
            </div>
          </fieldset>
        </form>
      </aside>
    </section>
  </main>

  <p id="notice" class="notice" role="status" hidden=""></p>
  <noscript>请启用 JavaScript 后开始练习。 / Enable JavaScript to start practicing.</noscript>
</div>
