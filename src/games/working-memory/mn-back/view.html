<div class="page">
  {{header}}
  <main>
    <section class="workspace">
      <div class="board-panel">
        <div class="board-top">
          <span id="phase-label" class="phase-label" role="status" data-i18n="ui.ready"
            >准备开始</span
          >
          <span id="round-counter" class="board-count"></span>
        </div>
        <div id="matrix-frame" class="mn-matrix-frame">
          <div id="matrix" class="mn-matrix" aria-hidden="true"></div>
          <div id="cover" class="mn-cover">
            <strong id="cover-title" data-i18n="ui.ready">准备开始</strong>
            <span id="cover-caption"></span>
          </div>
        </div>
        <div
          id="response-progress"
          class="progress mn-progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          data-i18n-attrs='{"aria-label":"mn.response-time"}'
        >
          <span id="response-fill"></span>
        </div>
        <div
          id="responses"
          class="mn-responses"
          role="group"
          data-i18n-attrs='{"aria-label":"mn.matching-channels"}'
        ></div>
        <div class="board-bottom"><span id="board-hint"></span></div>
        <div id="result-details" class="mn-result-details" hidden></div>
      </div>
      <aside class="sidebar">
        <div class="score-block">
          <div class="score-label" data-i18n="mn.f1-score">F1 得分</div>
          <div class="score"><strong id="score-value">—</strong><span>%</span></div>
          <p id="result-note" aria-live="polite"></p>
          <button type="button" id="action">
            <span id="action-label" data-i18n="ui.start">开始</span>
            <svg
              id="action-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path d="M5 12h14m-6-6 6 6-6 6" />
            </svg>
          </button>
        </div>
        <form id="settings" class="settings" data-i18n-attrs='{"aria-label":"ui.settings"}'>
          <fieldset>
            <legend data-i18n="game.grid-size">棋盘大小</legend>
            <div class="size-options">
              <label><input type="radio" name="size" value="3" checked /><span>3×3</span></label>
              <label><input type="radio" name="size" value="4" /><span>4×4</span></label>
              <label><input type="radio" name="size" value="5" /><span>5×5</span></label>
              <label><input type="radio" name="size" value="6" /><span>6×6</span></label>
              <label><input type="radio" name="size" value="7" /><span>7×7</span></label>
            </div>
          </fieldset>
          <fieldset data-summary-format="mn.n-summary">
            <legend data-i18n="mn.n-label">回溯长度 N</legend>
            <div class="size-options mn-lengths">
              <label><input type="radio" name="n" value="1" checked /><span>1</span></label>
              <label><input type="radio" name="n" value="2" /><span>2</span></label>
              <label><input type="radio" name="n" value="3" /><span>3</span></label>
              <label><input type="radio" name="n" value="4" /><span>4</span></label>
              <label><input type="radio" name="n" value="5" /><span>5</span></label>
              <label><input type="radio" name="n" value="6" /><span>6</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="mn.channels">刺激通道</legend>
            <div class="mn-channel-options">
              <label
                ><input type="checkbox" name="position" checked disabled /><span
                  data-i18n="mn.position"
                  >位置</span
                ></label
              >
              <label
                ><input type="checkbox" name="sound" /><span data-i18n="mn.sound">声音</span></label
              >
              <label
                ><input type="checkbox" name="shape" /><span data-i18n="mn.shape">形状</span></label
              >
              <label
                ><input type="checkbox" name="color" /><span data-i18n="mn.color">颜色</span></label
              >
            </div>
          </fieldset>
        </form>
        <div class="display-scale-control">
          <label for="display-scale" data-i18n="ui.display-size">显示大小</label>
          <input
            type="range"
            id="display-scale"
            min="40"
            max="100"
            step="5"
            value="100"
            aria-controls="matrix"
            aria-valuetext="100%"
          />
          <output id="display-scale-value" for="display-scale">100%</output>
        </div>
        <details class="help">
          <summary data-i18n="span.how-to-play">玩法</summary>
          <p data-i18n="mn.instructions">
            每次分别判断已开启通道是否与 N 步前相同。多项符合就都选；没有符合的就不选。
          </p>
          <p data-i18n="mn.toggle-help">点击可选中或取消，倒计时结束时提交。</p>
          <p data-i18n="mn.scoring-help">F1 综合命中、误报和漏报。分数越高越好。</p>
          <p>
            <a href="../../audio/mn-back/NOTICE.txt" data-i18n="mn.audio-credit">字母录音来源</a>
          </p>
        </details>
      </aside>
    </section>
  </main>
  <p id="notice" class="notice" role="status" hidden></p>
  <noscript>请启用 JavaScript。 / Please enable JavaScript.</noscript>
</div>
